# ===========================================================================
#  wallpaper-cava  ·  one config, one instance, all monitors
#  Validate: wallpaper-cava --config config.toml --check-config
# ===========================================================================

# --- General -----------------------------------------------------------------
[general]
framerate        = 60                              # 1-240
background_color = { hex = "#000000", alpha = 0.0 } # transparent: wallpaper shows through
sensitivity      = 40                              # passed straight to cava

# Pin to a single output (legacy). Leave commented to open one view per
# output from this single instance; per-output tuning lives in [outputs.*].
# preferred_output = "DP-1"

# --- Bars --------------------------------------------------------------------
[bars]
amount = 64    # 1-1024 (cava runs at the MAX across outputs)
gap    = 0.15  # as a fraction of bar width (0.0-5.0)

# --- Colors: Mint/Teal -> Cyan -> Deep Blue -> Mauve --------------------------
[colors]
gradient_color_1 = { hex = "#94e2d5", alpha = 0.85 } # Mint      · low neon glow
gradient_color_2 = { hex = "#a6e3a1", alpha = 0.85 } # Green     · soft transition
gradient_color_3 = { hex = "#89dceb", alpha = 0.90 } # Sky       · cyan
gradient_color_4 = { hex = "#74c7ec", alpha = 0.90 } # Sapphire  · blue
gradient_color_5 = { hex = "#89b4fa", alpha = 0.95 } # Lavender  · deep blue
gradient_color_6 = { hex = "#b4befe", alpha = 0.95 } # Light blue· fading upward
gradient_color_7 = { hex = "#f5c2e7", alpha = 1.0 }  # Pink      · vertical neon
gradient_color_8 = { hex = "#cba6f7", alpha = 1.0 }  # Mauve     · peak

# --- Smoothing (passed straight to cava) -------------------------------------
[smoothing]
# monstercat      = 0   # 0 disables
# waves           = 0   # works properly with a fresh github cava build
# noise_reduction = 0.5 # 0 fast/noisy · 1 slow/smooth

# --- Per-monitor settings ----------------------------------------------------
# Names: `hyprctl monitors all` (Hyprland), `swaymsg -t get_outputs` (Sway),
# or `wlr-randr`. Anything unset falls back to the globals.
# Cava runs at the MAX bars_amount across outputs; smaller views resample.

[outputs."DP-1"]
# Uses the global defaults. Examples:
# bars_amount      = 96
# bars_gap         = 0.2
# background_color = { hex = "#000000", alpha = 0.0 }
# [outputs."DP-1".colors]
# gradient_color_1 = '#20000077'
# gradient_color_2 = '#dc143cdd'

# [outputs."DP-2"]
# bars_amount = 48
# [outputs."DP-2".colors]
# gradient_color_1 = { hex = "#94e2d5", alpha = 0.85 }
# gradient_color_2 = { hex = "#cba6f7", alpha = 1.0 }

# [outputs."HDMI-A-1"]
# bars_amount = 32
