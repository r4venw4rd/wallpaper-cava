[general]
framerate = 60
background_color = { hex = "#000000", alpha = 0.0 }
sensitivity = 40
# Single-output filter (legacy). Leave commented to render on EVERY output
# from this one instance; per-output tuning lives in [outputs.*] below.
# preferred_output = "DP-1"
[bars]
amount = 64
gap = 0.15

[colors]
# Renk Teorisi: Mint/Teal -> Cyan -> Deep Blue -> Mauve
gradient_color_1 = { hex = "#94e2d5", alpha = 0.85 }  # Mint Yeşil (Duvar kağıdındaki parlak alt neonlar)
gradient_color_2 = { hex = "#a6e3a1", alpha = 0.85 }  # Yumuşak Yeşil geçişi
gradient_color_3 = { hex = "#89dceb", alpha = 0.90 }  # Sky / Camgöbeği
gradient_color_4 = { hex = "#74c7ec", alpha = 0.90 }  # Sapphire Mavi
gradient_color_5 = { hex = "#89b4fa", alpha = 0.95 }  # Lavender / Derin Mavi
gradient_color_6 = { hex = "#b4befe", alpha = 0.95 }  # Light Mavi (Yukarı doğru loşlaşma)
gradient_color_7 = { hex = "#f5c2e7", alpha = 1.0 }   # Catppuccin Pink (Arka plandaki dikey neonlar)
gradient_color_8 = { hex = "#cba6f7", alpha = 1.0 }   # Mauve Mor (Tepe noktası - Odanın loşluğuna uyumlu zirve)

[smoothing]

# ---------------------------------------------------------------------------
# Per-output overrides. One instance draws on all outputs; each named output
# gets its own bars/colors, everything else falls back to the globals above.
# Output names: `hyprctl monitors all` (e.g. DP-1, DP-2, HDMI-A-1).
# Cava runs at the MAX bars_amount across outputs; smaller views resample.
# ---------------------------------------------------------------------------

[outputs."DP-1"]
# Uses global defaults as-is. Override examples:
# bars_amount = 96
# bars_gap = 0.2
# background_color = { hex = "#000000", alpha = 0.0 }
# [outputs."DP-1".colors]
# gradient_color_1 = '#20000077'
# gradient_color_2 = '#dc143cdd'

# [outputs."DP-2"]
# bars_amount = 48
# [outputs."DP-2".colors]
# gradient_color_1 = { hex = "#94e2d5", alpha = 0.85 }
# gradient_color_2 = { hex = "#cba6f7", alpha = 1.0 }

# [outputs."HDMI-A-1"]
# bars_amount = 32
