[workspace]
members = [
    "crates/domain",
    "crates/infra",
    "crates/application",
    "crates/config",
    "crates/audio",
    "crates/render",
    "apps/wallpaper-cava",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8.14"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
gl = "0.14.0"
khronos-egl = { version = "6.0.0", features = ["static", "1_0", "1_1", "1_2", "1_3", "1_4", "1_5"] }
smithay-client-toolkit = "0.20.0"
wayland-egl = "0.32.0"
proptest = "1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
